# NOTE: written locally and checked as valid YAML, but never executed on GitHub from the development machine.
# The first run on GitHub is the real test: fix what it reports.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read  # nothing here needs more

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Tests
        # tests needing the LFW photos or the downloaded models skip themselves when those are absent
        run: python -m pytest -q

  web-only:
    name: web app without the camera dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: python -m pip install -r requirements-web.txt pytest httpx
      - name: Import and start the web app with no dlib installed
        run: |
          python - <<'EOF'
          import importlib.util, sys
          assert importlib.util.find_spec("dlib") is None, "dlib must not be installed in this job"
          sys.path.insert(0, "src")
          from facerec.web.app import create_app
          import tempfile, pathlib
          app = create_app(pathlib.Path(tempfile.mkdtemp()) / "t.db")
          print("web app created:", app.title)
          EOF

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the web image
        uses: docker/build-push-action@v6
        with: {context: ., target: web, push: false, load: true, tags: "facegate-web:ci"}
      - name: The web image starts and answers
        run: |
          docker run -d --name fg -p 8000:8000 facegate-web:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs fg; exit 1
      - name: Build the recognition image
        uses: docker/build-push-action@v6
        with: {context: ., target: service, push: false, tags: "facegate-service:ci"}

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-web.txt
