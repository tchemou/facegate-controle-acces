[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facerec"
version = "0.2.0"
description = "FaceGate: face-recognition access control with an administration web app: reliable real-time recognition on a standard webcam, random-challenge anti-spoofing, encrypted templates, roles and two-factor sign-in."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "dlib-bin>=19.24",
    "face-recognition-models>=0.3.0",
    "matplotlib>=3.8",
    "pillow>=10",
    "cryptography>=43",
]

[project.optional-dependencies]
# the administration web app (see also requirements-web.txt, used by the Docker web image)
web = [
    "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "segno>=1.6",
]
dev = ["pytest>=8", "scikit-learn>=1.4", "httpx>=0.27", "facerec[web]"]

[project.scripts]
facerec = "facerec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facerec = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
